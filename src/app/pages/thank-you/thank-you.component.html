<app-inner-page-header
    title="Thank You">
</app-inner-page-header>


<section class="thank-you-section">

    <!-- BACKGROUND DECORATION -->
    <div class="thank-you-shape shape-one"></div>
    <div class="thank-you-shape shape-two"></div>


    <div class="container">

        <div class="thank-you-wrapper">


            <!-- =========================================
                 SUCCESS VISUAL
            ========================================== -->

            <div class="thank-you-visual">

                <div class="success-rings">

                    <div class="success-ring ring-one"></div>

                    <div class="success-ring ring-two"></div>

                    <div class="success-icon">
                        <i class="fa-solid fa-check"></i>
                    </div>

                </div>


                <div class="visual-decoration">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>


            <!-- =========================================
                 CONTENT
            ========================================== -->

            <div class="thank-you-content">

                <div class="thank-you-label">

                    <span class="label-line"></span>

                    <span>
                        Message Received
                    </span>

                </div>


                <h1>
                    Thank You for
                    <strong>Getting in Touch.</strong>
                </h1>


                <p class="thank-you-description">
                    Your message has been sent successfully.
                    Our team will review your enquiry and get
                    back to you as soon as possible.
                </p>


                <!-- CONFIRMATION -->

                <div class="confirmation-note">

                    <div class="confirmation-icon">
                        <i class="fa-regular fa-envelope"></i>
                    </div>

                    <div>

                        <strong>
                            Your enquiry has been received
                        </strong>

                        <p>
                            There is no need to submit the
                            form again.
                        </p>

                    </div>

                </div>


                <!-- ACTIONS -->

                <div class="thank-you-actions">

                    <a
                        routerLink="/"
                        class="primary-action">

                        <span>
                            Back to Home
                        </span>

                        <i class="fa-solid fa-arrow-right"></i>

                    </a>


                    <a
                        routerLink="/contact-us"
                        class="secondary-action">

                        <i class="fa-solid fa-phone"></i>

                        <span>
                            Contact Us
                        </span>

                    </a>

                </div>

            </div>

        </div>

    </div>

</section>
